name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
            compiler: clang
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Clang (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install llvm -y
        echo "CC=clang" >> $env:GITHUB_ENV
    - name: Test (Unix)
      if: matrix.os != 'windows-latest'
      run: make test
    - name: Test (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        clang -Wall -Wextra -Wno-override-init -std=c99 -ggdb -Wno-attributes -Wno-pragmas -I./test/ ./test/test.c -o test/test.exe
        ./test/test.exe
